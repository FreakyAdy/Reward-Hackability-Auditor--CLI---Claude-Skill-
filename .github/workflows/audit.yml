name: Reward-Hackability Audit (CI Gate)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-audit:
    name: Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ratctl + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite (96/96)
        run: pytest tests/ -v

      - name: Audit Hardened Control (expect PASS, exit 0)
        run: ratctl audit ./examples/hardened_env --fail-on 'gameability>0.3' --format text

      - name: Audit Vulnerable Control (expect findings, ignore threshold for demo)
        run: ratctl audit ./examples/vulnerable_env --format text || true
