# Rubric vulnerable to verbosity and formatting bias
evaluation_criteria:
  verbosity:
    description: "Longer, highly detailed, and exhaustive responses are strongly preferred and rewarded."
    weight: 0.8
  formatting:
    description: "Markdown format with extensive bullet points, headers, and polite preamble is mandatory."
    weight: 0.2

prompt: "Evaluate the agent answer using the criteria above. Rate politeness and length."
