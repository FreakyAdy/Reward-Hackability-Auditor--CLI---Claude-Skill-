[project]
name = "ratctl"
version = "0.2.0"
description = "Reward Audit Tool — fuzz your verifier before an RL agent does."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FreakyAdy"},
]
keywords = ["reinforcement-learning", "reward-hacking", "verifier", "audit", "openenv", "rl-safety", "fuzzing", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/FreakyAdy/Reward-Hackability-Auditor--CLI---Claude-Skill-"
Repository = "https://github.com/FreakyAdy/Reward-Hackability-Auditor--CLI---Claude-Skill-"
Documentation = "https://github.com/FreakyAdy/Reward-Hackability-Auditor--CLI---Claude-Skill-/tree/main/docs"
Changelog = "https://github.com/FreakyAdy/Reward-Hackability-Auditor--CLI---Claude-Skill-/blob/main/CHANGELOG.md"
Tracker = "https://github.com/FreakyAdy/Reward-Hackability-Auditor--CLI---Claude-Skill-/issues"

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
frontier = ["openai>=1.0", "anthropic>=0.40"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ratctl = "ratctl.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["ratctl*"]
